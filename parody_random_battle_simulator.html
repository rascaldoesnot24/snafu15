<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon-Showdown: 6v6 Parody Random Battles with Mega Evolution</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        showdownDark: '#0e1217',
                        showdownPanel: '#181e28',
                        showdownBorder: '#2a3447',
                        showdownHeader: '#131822',
                        megaGlow: '#d946ef'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        pixel: ['"Press Start 2P"', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap');

        .font-pixel { font-family: 'Press Start 2P', monospace; }

        /* Battle Field CSS Gradient Background */
        .battle-arena-bg {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 50%, #15803d 50%, #166534 100%);
        }

        /* Healthbar Smooth Animated Transition */
        .hp-bar-fill {
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
        }

        /* Mega Evolution Visual Aura Animation */
        @keyframes megaAuraGlow {
            0% { filter: drop-shadow(0 0 8px #e879f9) drop-shadow(0 0 16px #c084fc); transform: scale(1); }
            50% { filter: drop-shadow(0 0 22px #f0abfc) drop-shadow(0 0 35px #a855f7); transform: scale(1.06); }
            100% { filter: drop-shadow(0 0 8px #e879f9) drop-shadow(0 0 16px #c084fc); transform: scale(1); }
        }

        .mega-aura {
            animation: megaAuraGlow 2s infinite ease-in-out;
        }

        /* Sprite Animations */
        @keyframes attackPlayer {
            0% { transform: translate(0, 0); }
            30% { transform: translate(45px, -35px) scale(1.12); }
            100% { transform: translate(0, 0); }
        }

        @keyframes attackOpponent {
            0% { transform: translate(0, 0); }
            30% { transform: translate(-45px, 35px) scale(1.12); }
            100% { transform: translate(0, 0); }
        }

        @keyframes hitHurt {
            0%, 100% { filter: brightness(1); }
            20%, 60% { filter: brightness(3.5) sepia(1) hue-rotate(-50deg); opacity: 0.3; }
            40%, 80% { opacity: 1; filter: brightness(1); }
        }

        @keyframes switchOutAnim {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            100% { transform: scale(0.1) translateY(60px); opacity: 0; }
        }

        @keyframes switchInAnim {
            0% { transform: scale(0.1) translateY(-60px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes floatIdle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 6px); }
            40% { transform: translate(8px, -6px); }
            60% { transform: translate(-5px, -3px); }
            80% { transform: translate(5px, 3px); }
        }

        .anim-attack-player { animation: attackPlayer 0.4s ease-in-out; }
        .anim-attack-opponent { animation: attackOpponent 0.4s ease-in-out; }
        .anim-hurt { animation: hitHurt 0.5s ease-in-out; }
        .anim-switch-out { animation: switchOutAnim 0.35s ease-in forwards; }
        .anim-switch-in { animation: switchInAnim 0.35s ease-out forwards; }
        .anim-idle { animation: floatIdle 3.2s ease-in-out infinite; }
        .anim-shake { animation: screenShake 0.45s ease-in-out; }

        /* Custom Scrollbars */
        #battleLog::-webkit-scrollbar { width: 6px; }
        #battleLog::-webkit-scrollbar-track { background: #0f172a; }
        #battleLog::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-showdownDark text-gray-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden">

        </div>

                <span id="soundIcon">🔊</span> <span id="soundText" class="hidden sm:inline">Audio: ON</span>

                Forfeit

            <button onclick="startNewBattle()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded font-semibold transition shadow-md">
                New Battle

        </div>
    </header>

        </div>

                </div>

            <!-- BATTLE LOG CONSOLE -->

                    <span>Battle Log</span>
                    <span class="w-2 h-2 rounded-full bg-fuchsia-500 animate-pulse"></span>
                </div>

                    <!-- Dynamic turn log entries -->
                </div>
            </div>

        </div>
    </main>

        </div>
    </div>

        /* ==========================================================================
           3. WEB AUDIO API SYNTHESIZER
           ========================================================================== */

        let soundEnabled = true;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundIcon').innerText = soundEnabled ? '🔊' : '🔇';
            document.getElementById('soundText').innerText = soundEnabled ? 'Audio: ON' : 'Audio: OFF';
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'mega') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.55);
            } else if (type === 'hit') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'super') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(340, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.28);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.28);
            } else if (type === 'switch') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'faint') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.linearRampToValueAtTime(90, now + 0.5);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.04);
            }
        }

        /* ==========================================================================
           4. GAME STATE & ENGINE LOGIC
           ========================================================================== */

        let gameState = {
            turn: 1,
            playerTeam: [],
            oppTeam: [],
            playerActiveIdx: 0,
            oppActiveIdx: 0,
            playerMegaUsed: false,
            oppMegaUsed: false,
            playerMegaSelected: false,
            playerHazards: { stealthrock: false },
            oppHazards: { stealthrock: false },
            isAnimating: false,
            forcedSwitch: false,
            gameOver: false,
            stats: { playerKills: 0, oppKills: 0, turns: 0 }
        };

        function calculateStat(base, isHp) {
            const iv = 31; const ev = 85; const level = 100;
            if (isHp) return Math.floor(((2 * base + iv + Math.floor(ev / 4)) * level) / 100) + level + 10;
            return Math.floor((((2 * base + iv + Math.floor(ev / 4)) * level) / 100) + 5);
        }

        function instantiateMonster(base) {
            const hp = calculateStat(base.baseStats.hp, true);
            const stats = {
                hp: hp,
                atk: calculateStat(base.baseStats.atk, false),
                def: calculateStat(base.baseStats.def, false),
                spa: calculateStat(base.baseStats.spa, false),
                spd: calculateStat(base.baseStats.spd, false),
                spe: calculateStat(base.baseStats.spe, false)
            };

            const ppMap = {};
            base.moves.forEach(mKey => {
                if (MOVE_POOL[mKey]) ppMap[mKey] = MOVE_POOL[mKey].maxPp;
            });

            return {
                ...base,
                maxHp: hp,
                currentHp: hp,
                stats: stats,
                statStages: { atk: 0, def: 0, spa: 0, spd: 0, spe: 0 },
                status: null,
                sleepTurns: 0,
                isMega: false,
                gender: Math.random() < 0.5 ? '♂' : '♀',
                pp: ppMap
            };
        }

        function startNewBattle() {
            playSound('click');

            const shuffled = [...MONSTER_ROSTER].sort(() => 0.5 - Math.random());
            
            gameState.playerTeam = shuffled.slice(0, 6).map(instantiateMonster);
            gameState.oppTeam = shuffled.slice(6, 12).map(instantiateMonster);
            gameState.playerActiveIdx = 0;
            gameState.oppActiveIdx = 0;
            gameState.playerMegaUsed = false;
            gameState.oppMegaUsed = false;
            gameState.playerMegaSelected = false;
            gameState.playerHazards = { stealthrock: false };
            gameState.oppHazards = { stealthrock: false };
            gameState.turn = 1;
            gameState.isAnimating = false;
            gameState.forcedSwitch = false;
            gameState.gameOver = false;
            gameState.stats = { playerKills: 0, oppKills: 0, turns: 0 };

            document.getElementById('battleLog').innerHTML = '';
            appendLog(`Format: <strong>[Gen 9] 6v6 Random Battle with Mega Evolution</strong>`, 'text-fuchsia-300 border-b border-gray-800 pb-1');
            appendLog(`Battle started between <strong>Player</strong> and <strong>Opponent</strong>!`, 'text-yellow-400 font-semibold');
            
            triggerAbilityOnEntry(gameState.playerTeam[0], true);
            triggerAbilityOnEntry(gameState.oppTeam[0], false);

            updateUI();
            showMainActions();
        }

        function triggerAbilityOnEntry(mon, isPlayer) {
            if (mon.ability === "Intimidate") {
                const target = isPlayer ? gameState.oppTeam[gameState.oppActiveIdx] : gameState.playerTeam[gameState.playerActiveIdx];
                if (target && target.currentHp > 0) {
                    target.statStages.atk = Math.max(-6, (target.statStages.atk || 0) - 1);
                    appendLog(`<strong>${mon.name}</strong>'s Intimidate cut ${isPlayer ? "Foe " : ""}${target.name}'s Attack!`, 'text-yellow-300 font-semibold');
                }
            }
        }

        function getTypeMultiplier(moveType, targetTypes) {
            let mult = 1.0;
            targetTypes.forEach(t => {
                if (TYPE_CHART[moveType] && TYPE_CHART[moveType][t] !== undefined) {
                    mult *= TYPE_CHART[moveType][t];
                }
            });
            return mult;
        }

        function getEffectiveStat(mon, statName) {
            let val = mon.stats[statName];
            const stage = mon.statStages[statName] || 0;
            let mult = 1.0;
            if (stage > 0) mult = (2 + stage) / 2;
            if (stage < 0) mult = 2 / (2 + Math.abs(stage));

            val = Math.floor(val * mult);
            if (statName === 'spe' && mon.status === 'paralyze') val = Math.floor(val * 0.5);
            if (statName === 'atk' && mon.status === 'burn') val = Math.floor(val * 0.5);
            return val;
        }

        function calculateDamage(attacker, defender, move) {
            if (move.category === 'Status' || move.power === 0) return { damage: 0, crit: false, typeMult: 1 };

            const level = 100;
            const isPhysical = move.category === 'Physical';
            const atkVal = getEffectiveStat(attacker, isPhysical ? 'atk' : 'spa');
            const defVal = getEffectiveStat(defender, isPhysical ? 'def' : 'spd');

            let baseDmg = (((2 * level / 5 + 2) * move.power * (atkVal / defVal)) / 50) + 2;

            const stab = attacker.types.includes(move.type) ? 1.5 : 1.0;
            const typeMult = getTypeMultiplier(move.type, defender.types);
            const isCrit = Math.random() < (1 / 24);
            const critMult = isCrit ? 1.5 : 1.0;
            const randRoll = (Math.floor(Math.random() * 16) + 85) / 100;

            let finalDmg = Math.floor(baseDmg * stab * typeMult * critMult * randRoll);
            if (typeMult > 0 && finalDmg < 1) finalDmg = 1;

            return { damage: finalDmg, crit: isCrit, typeMult: typeMult };
        }

        /* --- TURN CONTROLLER --- */
        async function handleTurnAction(actionType, payload) {
            if (gameState.isAnimating || gameState.gameOver) return;

            if (gameState.forcedSwitch) {
                if (actionType !== 'switch') return;
                await executeSwitch(true, payload);
                gameState.forcedSwitch = false;
                document.getElementById('forcedSwitchBanner').classList.add('hidden');
                updateUI();
                showMainActions();
                return;
            }

            gameState.isAnimating = true;
            playSound('click');

            const pMon = gameState.playerTeam[gameState.playerActiveIdx];
            const oMon = gameState.oppTeam[gameState.oppActiveIdx];

            const aiAction = chooseAIAction();

            appendLog(`--- <strong>Turn ${gameState.turn}</strong> ---`, 'text-gray-500 mt-2 font-mono text-[11px]');

            // SWITCHES FIRST (+6 priority)
            if (actionType === 'switch') {
                await executeSwitch(true, payload);
                if (aiAction.type === 'switch') {
                    await executeSwitch(false, aiAction.targetIdx);
                } else {
                    if (aiAction.mega) await executeMegaEvolution(false);
                    await executeMove(gameState.oppTeam[gameState.oppActiveIdx], gameState.playerTeam[gameState.playerActiveIdx], aiAction.move, false);
                }
            } else if (aiAction.type === 'switch') {
                await executeSwitch(false, aiAction.targetIdx);
                if (gameState.playerMegaSelected) await executeMegaEvolution(true);
                await executeMove(gameState.playerTeam[gameState.playerActiveIdx], gameState.oppTeam[gameState.oppActiveIdx], payload, true);
            } else {
                // Attacks priority & speed comparison
                const pMove = payload;
                const oMove = aiAction.move;
                pMon.pp[pMove.key]--;

                const pPriority = pMove.priority || 0;
                const oPriority = oMove.priority || 0;

                let playerFirst = pPriority > oPriority;
                if (pPriority === oPriority) {
                    const pSpeed = getEffectiveStat(pMon, 'spe');
                    const oSpeed = getEffectiveStat(oMon, 'spe');
                    playerFirst = pSpeed > oSpeed || (pSpeed === oSpeed && Math.random() < 0.5);
                }

                if (playerFirst) {
                    if (gameState.playerMegaSelected) await executeMegaEvolution(true);
                    await executeMove(gameState.playerTeam[gameState.playerActiveIdx], gameState.oppTeam[gameState.oppActiveIdx], pMove, true);
                    
                    if (oMon.currentHp > 0 && pMon.currentHp > 0) {
                        await delay(400);
                        if (aiAction.mega) await executeMegaEvolution(false);
                        await executeMove(gameState.oppTeam[gameState.oppActiveIdx], gameState.playerTeam[gameState.playerActiveIdx], oMove, false);
                    }
                } else {
                    if (aiAction.mega) await executeMegaEvolution(false);
                    await executeMove(gameState.oppTeam[gameState.oppActiveIdx], gameState.playerTeam[gameState.playerActiveIdx], oMove, false);

                    if (pMon.currentHp > 0 && oMon.currentHp > 0) {
                        await delay(400);
                        if (gameState.playerMegaSelected) await executeMegaEvolution(true);
                        await executeMove(gameState.playerTeam[gameState.playerActiveIdx], gameState.oppTeam[gameState.oppActiveIdx], pMove, true);
                    }
                }
            }

            // End of turn checks
            if (!gameState.gameOver && !gameState.forcedSwitch) {
                const activeP = gameState.playerTeam[gameState.playerActiveIdx];
                const activeO = gameState.oppTeam[gameState.oppActiveIdx];
                if (activeP.currentHp > 0) await processEndOfTurnStatus(activeP, true);
                if (activeO.currentHp > 0) await processEndOfTurnStatus(activeO, false);
            }

            // Handle fainted monsters replacements
            const curP = gameState.playerTeam[gameState.playerActiveIdx];
            const curO = gameState.oppTeam[gameState.oppActiveIdx];

            if (curO.currentHp <= 0 && hasAliveMonsters(gameState.oppTeam)) {
                await delay(400);
                const bestNext = getBestAISwitchIdx();
                await executeSwitch(false, bestNext);
            }

            if (curP.currentHp <= 0 && hasAliveMonsters(gameState.playerTeam)) {
                gameState.forcedSwitch = true;
                document.getElementById('forcedSwitchBanner').classList.remove('hidden');
                appendLog(`Choose a replacement Pokémon!`, 'text-yellow-400 font-bold');
                showSwitchMenu();
                gameState.isAnimating = false;
                return;
            }

            gameState.turn++;
            gameState.playerMegaSelected = false; // Reset toggle
            document.getElementById('turnCounter').innerText = `Turn ${gameState.turn}`;
            updateUI();
            showMainActions();
            gameState.isAnimating = false;
        }

        /* Mega Evolution Routine */
        async function executeMegaEvolution(isPlayer) {
            const team = isPlayer ? gameState.playerTeam : gameState.oppTeam;
            const idx = isPlayer ? gameState.playerActiveIdx : gameState.oppActiveIdx;
            const mon = team[idx];

            if (mon.isMega || !mon.canMega) return;

            playSound('mega');
            if (isPlayer) gameState.playerMegaUsed = true;
            else gameState.oppMegaUsed = true;

            mon.isMega = true;
            const mf = mon.megaForm;

            // Recalculate boosted stats
            mon.name = mf.name;
            mon.types = mf.types;
            mon.svg = mf.svg;
            mon.stats.atk = calculateStat(mf.baseStats.atk, false);
            mon.stats.def = calculateStat(mf.baseStats.def, false);
            mon.stats.spa = calculateStat(mf.baseStats.spa, false);
            mon.stats.spd = calculateStat(mf.baseStats.spd, false);
            mon.stats.spe = calculateStat(mf.baseStats.spe, false);

            triggerImpactFX(isPlayer ? 'player' : 'opp', 'Fairy');
            appendLog(`🧬 <strong>${mon.name}</strong>'s Mega Ring reacts to its Mega Stone!`, 'text-fuchsia-400 font-extrabold text-sm');
            appendLog(`<strong>${mon.name}</strong> Mega Evolved into <strong>${mf.name}</strong>!`, 'text-fuchsia-300 font-bold');

            updateUI();
            await delay(600);
        }

        /* Execute Switch Routine */
        async function executeSwitch(isPlayer, newIdx) {
            playSound('switch');
            const team = isPlayer ? gameState.playerTeam : gameState.oppTeam;
            const oldIdx = isPlayer ? gameState.playerActiveIdx : gameState.oppActiveIdx;
            const oldMon = team[oldIdx];
            const newMon = team[newIdx];

            const namePrefix = isPlayer ? "" : "Foe ";
            appendLog(`${isPlayer ? "" : "Opponent "}withdrew <strong>${namePrefix}${oldMon.name}</strong>!`, 'text-gray-400');

            oldMon.statStages = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0 };

            const containerId = isPlayer ? 'playerSpriteContainer' : 'oppSpriteContainer';
            const container = document.getElementById(containerId);
            container.classList.add('anim-switch-out');
            await delay(350);

            if (isPlayer) gameState.playerActiveIdx = newIdx;
            else gameState.oppActiveIdx = newIdx;

            updateUI();

            container.classList.remove('anim-switch-out');
            container.classList.add('anim-switch-in');
            appendLog(`Go! <strong>${namePrefix}${newMon.name}</strong>!`, isPlayer ? 'text-blue-300 font-semibold' : 'text-red-300 font-semibold');
            
            triggerAbilityOnEntry(newMon, isPlayer);

            await delay(350);
            container.classList.remove('anim-switch-in');

            // Hazard Check
            const hazards = isPlayer ? gameState.playerHazards : gameState.oppHazards;
            if (hazards.stealthrock && newMon.currentHp > 0) {
                const rockMult = getTypeMultiplier('Rock', newMon.types);
                const hazardDmg = Math.floor(newMon.maxHp * (0.125 * rockMult));
                newMon.currentHp = Math.max(0, newMon.currentHp - hazardDmg);
                appendLog(`Pointed stones dug into <strong>${namePrefix}${newMon.name}</strong>! (-${hazardDmg} HP)`, 'text-amber-400');
                updateHealthbars();

                if (newMon.currentHp <= 0) {
                    playSound('faint');
                    appendLog(`<strong>${namePrefix}${newMon.name}</strong> fainted!`, 'text-red-500 font-bold');
                    checkBattleEnd();
                }
            }
        }

        /* Move Execution Routine */
        async function executeMove(attacker, defender, move, isPlayerAttacker) {
            const attackerName = isPlayerAttacker ? attacker.name : `Foe ${attacker.name}`;
            const defenderName = isPlayerAttacker ? `Foe ${defender.name}` : defender.name;

            if (attacker.status === 'sleep') {
                attacker.sleepTurns = (attacker.sleepTurns || 0) + 1;
                if (attacker.sleepTurns >= 3 || Math.random() < 0.33) {
                    attacker.status = null;
                    attacker.sleepTurns = 0;
                    appendLog(`${attackerName} woke up!`, 'text-green-400 font-semibold');
                } else {
                    appendLog(`${attackerName} is fast asleep!`, 'text-indigo-300');
                    return;
                }
            } else if (attacker.status === 'freeze') {
                if (Math.random() < 0.20) {
                    attacker.status = null;
                    appendLog(`${attackerName} thawed out!`, 'text-cyan-300 font-semibold');
                } else {
                    appendLog(`${attackerName} is frozen solid!`, 'text-cyan-400');
                    return;
                }
            } else if (attacker.status === 'paralyze' && Math.random() < 0.25) {
                appendLog(`${attackerName} is paralyzed! It can't move!`, 'text-yellow-400');
                return;
            }

            appendLog(`<strong>${attackerName}</strong> used <strong>${move.name}</strong>!`);

            if (Math.random() * 100 > move.accuracy) {
                await delay(300);
                appendLog(`It missed!`, 'text-gray-400 italic');
                return;
            }

            const attackerContainer = document.getElementById(isPlayerAttacker ? 'playerSpriteContainer' : 'oppSpriteContainer');
            attackerContainer.classList.add(isPlayerAttacker ? 'anim-attack-player' : 'anim-attack-opponent');
            setTimeout(() => attackerContainer.classList.remove('anim-attack-player', 'anim-attack-opponent'), 400);

            await delay(200);

            if (move.category !== 'Status') {
                const res = calculateDamage(attacker, defender, move);
                defender.currentHp = Math.max(0, defender.currentHp - res.damage);

                const defenderContainer = document.getElementById(isPlayerAttacker ? 'oppSpriteContainer' : 'playerSpriteContainer');
                defenderContainer.classList.add('anim-hurt');
                
                if (res.typeMult > 1) {
                    document.getElementById('battleArena').classList.add('anim-shake');
                    playSound('super');
                } else {
                    playSound('hit');
                }

                triggerImpactFX(isPlayerAttacker ? 'opp' : 'player', move.type);

                setTimeout(() => {
                    defenderContainer.classList.remove('anim-hurt');
                    document.getElementById('battleArena').classList.remove('anim-shake');
                }, 500);

                updateHealthbars();

                if (res.crit) appendLog(`A critical hit!`, 'text-red-400 font-semibold');
                if (res.typeMult > 1) appendLog(`It's super effective!`, 'text-green-400 font-bold');
                if (res.typeMult > 0 && res.typeMult < 1) appendLog(`It's not very effective...`, 'text-gray-400');
                if (res.typeMult === 0) appendLog(`It had no effect!`, 'text-gray-500');

                if (move.statusEff && defender.currentHp > 0 && !defender.status) {
                    if (Math.random() < move.statusEff.chance) {
                        defender.status = move.statusEff.type;
                        appendLog(`${defenderName} was ${move.statusEff.type}d!`, 'text-purple-300 font-semibold');
                    }
                }

            } else {
                if (move.statBoost) {
                    const s = move.statBoost.stat;
                    attacker.statStages[s] = Math.min(6, (attacker.statStages[s] || 0) + move.statBoost.stages);
                    appendLog(`${attackerName}'s ${s.toUpperCase()} rose!`, 'text-blue-300 font-semibold');
                }
                if (move.statBoost2) {
                    const s2 = move.statBoost2.stat;
                    attacker.statStages[s2] = Math.min(6, (attacker.statStages[s2] || 0) + move.statBoost2.stages);
                    appendLog(`${attackerName}'s ${s2.toUpperCase()} rose!`, 'text-blue-300 font-semibold');
                }
                if (move.healPct) {
                    const healed = Math.floor(attacker.maxHp * move.healPct);
                    attacker.currentHp = Math.min(attacker.maxHp, attacker.currentHp + healed);
                    appendLog(`${attackerName} restored HP!`, 'text-green-400 font-semibold');
                    updateHealthbars();
                }
                if (move.statusEff && !defender.status) {
                    defender.status = move.statusEff.type;
                    appendLog(`${defenderName} was ${move.statusEff.type}d!`, 'text-purple-300 font-semibold');
                }
                if (move.hazard) {
                    const hazardObj = isPlayerAttacker ? gameState.oppHazards : gameState.playerHazards;
                    if (!hazardObj.stealthrock) {
                        hazardObj.stealthrock = true;
                        appendLog(`Pointed stones float around ${isPlayerAttacker ? 'the opponent' : 'your'} team!`, 'text-amber-400 font-semibold');
                    } else {
                        appendLog(`But it failed!`, 'text-gray-400');
                    }
                }
            }

            if (defender.currentHp <= 0) {
                await delay(400);
                playSound('faint');
                appendLog(`<strong>${defenderName}</strong> fainted!`, 'text-red-500 font-bold');
                if (isPlayerAttacker) gameState.stats.playerKills++;
                else gameState.stats.oppKills++;

                checkBattleEnd();
            }
        }

        async function processEndOfTurnStatus(mon, isPlayer) {
            if (!mon.status) return;
            const name = isPlayer ? mon.name : `Foe ${mon.name}`;
            if (mon.status === 'poison' || mon.status === 'burn') {
                const loss = Math.floor(mon.maxHp / (mon.status === 'poison' ? 8 : 16));
                mon.currentHp = Math.max(0, mon.currentHp - loss);
                appendLog(`${name} is hurt by its ${mon.status}! (-${loss} HP)`, 'text-purple-400');
                updateHealthbars();

                if (mon.currentHp <= 0) {
                    playSound('faint');
                    appendLog(`<strong>${name}</strong> fainted!`, 'text-red-500 font-bold');
                    checkBattleEnd();
                }
            }
        }

        function checkBattleEnd() {
            const playerAlive = hasAliveMonsters(gameState.playerTeam);
            const oppAlive = hasAliveMonsters(gameState.oppTeam);

            if (!playerAlive || !oppAlive) {
                gameState.gameOver = true;
                endGame(playerAlive);
            }
        }

        function hasAliveMonsters(team) {
            return team.some(m => m.currentHp > 0);
        }

        /* Smart AI Logic */
        function chooseAIAction() {
            const aiMon = gameState.oppTeam[gameState.oppActiveIdx];
            const pMon = gameState.playerTeam[gameState.playerActiveIdx];

            // 1. AI Mega Evolution Logic
            let wantMega = false;
            if (!gameState.oppMegaUsed && aiMon.canMega && !aiMon.isMega) {
                wantMega = true;
            }

            // 2. Switching Check
            const bestSwitch = getBestAISwitchIdx();
            if (bestSwitch !== null && Math.random() < 0.20 && !wantMega) {
                return { type: 'switch', targetIdx: bestSwitch, mega: false };
            }

            // 3. Move Selection
            let bestMove = null;
            let maxDmg = -1;

            aiMon.moves.forEach(mKey => {
                const move = MOVE_POOL[mKey];
                if (aiMon.pp[mKey] > 0) {
                    if (move.category !== 'Status') {
                        const dmg = calculateDamage(aiMon, pMon, move).damage;
                        if (dmg > maxDmg) {
                            maxDmg = dmg;
                            bestMove = { ...move, key: mKey };
                        }
                    } else if (!bestMove) {
                        bestMove = { ...move, key: mKey };
                    }
                }
            });

            if (!bestMove) bestMove = { ...MOVE_POOL[aiMon.moves[0]], key: aiMon.moves[0] };

            return { type: 'attack', move: bestMove, mega: wantMega };
        }

        function getBestAISwitchIdx() {
            const pMon = gameState.playerTeam[gameState.playerActiveIdx];
            let bestIdx = null;
            let lowestMult = 99;

            gameState.oppTeam.forEach((m, idx) => {
                if (idx !== gameState.oppActiveIdx && m.currentHp > 0) {
                    let mult = 1.0;
                    pMon.types.forEach(pt => {
                        mult *= getTypeMultiplier(pt, m.types);
                    });
                    if (mult < lowestMult) {
                        lowestMult = mult;
                        bestIdx = idx;
                    }
                }
            });
            return bestIdx;
        }

        function confirmForfeit() {
            if (gameState.gameOver) return;
            if (confirm("Are you sure you want to forfeit?")) {
                appendLog(`<strong>You forfeited the match!</strong>`, 'text-red-500 font-bold');
                endGame(false);
            }
        }

        function endGame(playerWon) {
            gameState.gameOver = true;
            const modal = document.getElementById('gameOverModal');
            const title = document.getElementById('modalTitle');
            const subtitle = document.getElementById('modalSubtitle');
            const statsEl = document.getElementById('modalStats');

            if (playerWon) {
                title.innerText = "VICTORY!";
                title.className = "text-2xl sm:text-3xl font-extrabold font-pixel mb-2 text-green-400";
                subtitle.innerText = "You defeated the opponent's 6v6 Mega team!";
            } else {
                title.innerText = "DEFEAT!";
                title.className = "text-2xl sm:text-3xl font-extrabold font-pixel mb-2 text-red-500";
                subtitle.innerText = "All 6 of your Pokémon fainted!";
            }

            statsEl.innerHTML = `
                <div>• Total Turns: <span class="text-white">${gameState.turn}</span></div>
                <div>• Foe Pokémon Defeated: <span class="text-white">${gameState.stats.playerKills} / 6</span></div>
                <div>• Your Pokémon Lost: <span class="text-white">${gameState.stats.oppKills} / 6</span></div>
            `;

            modal.classList.remove('hidden');
        }

        function closeModalAndRestart() {
            document.getElementById('gameOverModal').classList.add('hidden');
            startNewBattle();
        }

        /* ==========================================================================
           5. UI RENDERING & MENU NAVIGATION
           ========================================================================== */

        function updateUI() {
            const p = gameState.playerTeam[gameState.playerActiveIdx];
            const o = gameState.oppTeam[gameState.oppActiveIdx];

            // Player Active HUD
            document.getElementById('playerName').innerText = p.name;
            document.getElementById('playerGender').innerText = p.gender;
            document.getElementById('playerSvg').innerHTML = p.svg;
            document.getElementById('playerMegaBadge').className = p.isMega ? "text-[9px] bg-gradient-to-r from-fuchsia-600 to-purple-600 text-white px-1.5 py-0.5 rounded font-black uppercase shadow" : "hidden";
            renderTypes('playerTypes', p.types);
            renderStatusBadge('playerStatus', p.status);
            renderStageBadges('playerStageBadges', p.statStages);

            // Opponent Active HUD
            document.getElementById('oppName').innerText = o.name;
            document.getElementById('oppGender').innerText = o.gender;
            document.getElementById('oppSvg').innerHTML = o.svg;
            document.getElementById('oppMegaBadge').className = o.isMega ? "text-[9px] bg-gradient-to-r from-fuchsia-600 to-purple-600 text-white px-1.5 py-0.5 rounded font-black uppercase shadow" : "hidden";
            renderTypes('oppTypes', o.types);
            renderStatusBadge('oppStatus', o.status);
            renderStageBadges('oppStageBadges', o.statStages);

            // Bench Pokeballs
            renderBenchIcons('playerBenchIcons', gameState.playerTeam, gameState.playerActiveIdx);
            renderBenchIcons('oppBenchIcons', gameState.oppTeam, gameState.oppActiveIdx);

            // Hazards Display
            document.getElementById('playerHazards').innerText = gameState.playerHazards.stealthrock ? '[Pebble Trap]' : '';
            document.getElementById('oppHazards').innerText = gameState.oppHazards.stealthrock ? '[Pebble Trap]' : '';

            updateHealthbars();
        }

        function renderBenchIcons(containerId, team, activeIdx) {
            const container = document.getElementById(containerId);
            container.innerHTML = team.map((mon, idx) => {
                let opacity = 'opacity-100';
                let iconColor = 'bg-red-500';
                if (mon.currentHp <= 0) {
                    iconColor = 'bg-gray-700';
                    opacity = 'opacity-40';
                } else if (idx === activeIdx) {
                    iconColor = mon.isMega ? 'bg-fuchsia-400 ring-2 ring-fuchsia-300' : 'bg-yellow-400 ring-2 ring-yellow-200';
                }
                return `<div title="${mon.name} (${Math.ceil((mon.currentHp/mon.maxHp)*100)}%)" class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full ${iconColor} ${opacity} border border-black/50 shadow-inner"></div>`;
            }).join('');
        }

        function renderTypes(containerId, types) {
            const container = document.getElementById(containerId);
            container.innerHTML = types.map(t => {
                const conf = TYPE_COLORS[t] || TYPE_COLORS.Normal;
                return `<span class="text-[9px] sm:text-[10px] px-1.5 py-0.2 rounded font-bold uppercase ${conf.bg} ${conf.text}">${t}</span>`;
            }).join('');
        }

        function renderStatusBadge(elementId, status) {
            const el = document.getElementById(elementId);
            if (!status) { el.classList.add('hidden'); return; }
            el.classList.remove('hidden');
            const colors = {
                burn: 'bg-red-600 text-white',
                paralyze: 'bg-yellow-400 text-black',
                sleep: 'bg-indigo-400 text-black',
                poison: 'bg-purple-600 text-white',
                freeze: 'bg-cyan-400 text-black'
            };
            el.className = `text-[9px] px-1.5 py-0.5 rounded font-bold uppercase ${colors[status] || 'bg-gray-600'}`;
            el.innerText = status.slice(0, 3);
        }

        function renderStageBadges(containerId, stages) {
            const container = document.getElementById(containerId);
            let html = '';
            for (let s in stages) {
                const val = stages[s];
                if (val !== 0) {
                    const isPos = val > 0;
                    html += `<span class="text-[8px] font-mono px-1 rounded font-bold ${isPos ? 'bg-blue-900/80 text-blue-300' : 'bg-red-950/80 text-red-300'}">${val > 0 ? '+' : ''}${val} ${s.toUpperCase()}</span>`;
                }
            }
            container.innerHTML = html;
        }

        function updateHealthbars() {
            const p = gameState.playerTeam[gameState.playerActiveIdx];
            const o = gameState.oppTeam[gameState.oppActiveIdx];

            const pPct = Math.max(0, Math.floor((p.currentHp / p.maxHp) * 100));
            const pBar = document.getElementById('playerHpBar');
            pBar.style.width = `${pPct}%`;
            pBar.className = `hp-bar-fill h-full ${getHpColorClass(pPct)}`;
            document.getElementById('playerHpText').innerText = `${p.currentHp}/${p.maxHp}`;
            document.getElementById('playerHpPercent').innerText = `${pPct}%`;

            const oPct = Math.max(0, Math.floor((o.currentHp / o.maxHp) * 100));
            const oBar = document.getElementById('oppHpBar');
            oBar.style.width = `${oPct}%`;
            oBar.className = `hp-bar-fill h-full ${getHpColorClass(oPct)}`;
            document.getElementById('oppHpPercent').innerText = `${oPct}%`;
        }

        function getHpColorClass(pct) {
            if (pct > 50) return 'bg-green-500';
            if (pct > 20) return 'bg-yellow-500';
            return 'bg-red-600';
        }

        /* --- CONTROL VIEW CONTROLLERS --- */

        function showMainActions() {
            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('panelTitle').innerText = "What will you do?";

            const view = document.getElementById('controlView');
            view.innerHTML = `
                <div class="grid grid-cols-2 gap-3 max-w-md mx-auto w-full">
                    <button onclick="showFightMenu()" class="bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold py-4 rounded-xl border-2 border-red-500/50 shadow-lg text-sm sm:text-base transition transform hover:-translate-y-0.5">
                        ⚔️ FIGHT
                    </button>
                    <button onclick="showSwitchMenu()" class="bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-500 hover:to-indigo-600 text-white font-bold py-4 rounded-xl border-2 border-blue-500/50 shadow-lg text-sm sm:text-base transition transform hover:-translate-y-0.5">
                        🔄 SWITCH MON
                    </button>
                </div>
            `;
        }

        function showFightMenu() {
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('panelTitle').innerText = "Select Attack Move";

            const pMon = gameState.playerTeam[gameState.playerActiveIdx];
            const view = document.getElementById('controlView');

            let movesHtml = pMon.moves.map(mKey => {
                const move = MOVE_POOL[mKey];
                const typeConf = TYPE_COLORS[move.type] || TYPE_COLORS.Normal;
                const currentPp = pMon.pp[mKey];
                const isDisabled = currentPp === 0;

                return `
                    <button onclick='handleTurnAction("attack", ${JSON.stringify({ ...move, key: mKey })})' 
                            onmouseenter='setHoverDetail("${move.name} | Type: ${move.type} | Cat: ${move.category} | Power: ${move.power || '--'} | Acc: ${move.accuracy}%")'
                            class="relative p-2 rounded-lg border-2 text-left transition transform hover:-translate-y-0.5 shadow-md flex flex-col justify-between ${typeConf.bg} ${typeConf.text} border-black/20 ${isDisabled ? 'opacity-40 cursor-not-allowed' : ''}"
                            ${isDisabled ? 'disabled' : ''}>
                        <div class="flex justify-between items-center w-full">
                            <span class="font-bold text-xs sm:text-sm truncate">${move.name}</span>
                            <span class="text-[10px] px-1 bg-black/20 rounded font-mono">${move.category}</span>
                        </div>
                        <div class="flex justify-between items-center w-full mt-1 text-[10px] sm:text-[11px] opacity-90 font-mono">
                            <span>PWR: ${move.power || '--'}</span>
                            <span>PP: ${currentPp}/${move.maxPp}</span>
                        </div>
                    </button>
                `;
            }).join('');

            // Mega Evolution Toggle Button
            const megaEligible = pMon.canMega && !pMon.isMega && !gameState.playerMegaUsed;
            const megaBtnClass = gameState.playerMegaSelected 
                ? 'bg-gradient-to-r from-fuchsia-600 to-purple-600 ring-2 ring-fuchsia-300 text-white font-black' 
                : (megaEligible ? 'bg-gray-800 hover:bg-gray-700 text-fuchsia-300 border border-fuchsia-500/50' : 'bg-gray-900 text-gray-600 border border-gray-800 cursor-not-allowed');

            view.innerHTML = `
                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center bg-gray-950 p-1.5 rounded-lg border border-gray-800">
                        <span class="text-xs font-semibold text-gray-300 px-1">Special Mechanic:</span>
                        <button onclick="toggleMegaSelected()" ${!megaEligible && !gameState.playerMegaSelected ? 'disabled' : ''} class="px-3 py-1 rounded text-xs font-bold transition flex items-center gap-1 ${megaBtnClass}">
                            <span>🧬 Mega Evolve</span>
                            <span class="text-[10px]">${gameState.playerMegaSelected ? ' [ACTIVE]' : (gameState.playerMegaUsed ? ' [USED]' : '')}</span>
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">${movesHtml}</div>
                </div>
            `;
        }

        function toggleMegaSelected() {
            playSound('click');
            gameState.playerMegaSelected = !gameState.playerMegaSelected;
            showFightMenu();
        }

        function showSwitchMenu() {
            if (!gameState.forcedSwitch) {
                document.getElementById('backBtn').classList.remove('hidden');
            }
            document.getElementById('panelTitle').innerText = "Select Party Monster";

            const view = document.getElementById('controlView');
            const activeIdx = gameState.playerActiveIdx;

            let monsHtml = gameState.playerTeam.map((mon, idx) => {
                const isActive = idx === activeIdx;
                const isFainted = mon.currentHp <= 0;
                const pct = Math.ceil((mon.currentHp / mon.maxHp) * 100);

                return `
                    <button onclick='handleTurnAction("switch", ${idx})'
                            onmouseenter='setHoverDetail("${mon.name} | HP: ${mon.currentHp}/${mon.maxHp} | Types: ${mon.types.join('/')}")'
                            class="p-2 rounded-lg border text-left transition flex justify-between items-center ${isActive ? 'bg-yellow-950/60 border-yellow-500' : 'bg-gray-800 border-gray-700 hover:bg-gray-750'} ${isFainted || isActive ? 'opacity-50 cursor-not-allowed' : ''}"
                            ${isFainted || isActive ? 'disabled' : ''}>
                        <div class="flex items-center gap-2 truncate">
                            <div class="w-2.5 h-2.5 rounded-full ${isFainted ? 'bg-gray-600' : (isActive ? 'bg-yellow-400' : 'bg-green-500')}"></div>
                            <div class="truncate">
                                <div class="font-bold text-xs ${isActive ? 'text-yellow-400' : 'text-gray-200'} truncate">${mon.name} ${mon.isMega ? '🧬' : ''}</div>
                                <div class="text-[10px] text-gray-400 font-mono">${mon.types.join('/')}</div>
                            </div>
                        </div>
                        <div class="text-right font-mono text-xs">
                            <div class="${getHpColorClass(pct).replace('bg-', 'text-')} font-bold">${pct}%</div>
                            <div class="text-[10px] text-gray-400">${mon.currentHp}/${mon.maxHp}</div>
                        </div>
                    </button>
                `;
            }).join('');

            view.innerHTML = `<div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${monsHtml}</div>`;
        }

        function setHoverDetail(text) {
            document.getElementById('actionHoverDetail').innerText = text;
        }

        function appendLog(htmlText, classNames = 'text-gray-200') {
            const logEl = document.getElementById('battleLog');
            const entry = document.createElement('div');
            entry.className = `leading-relaxed ${classNames}`;
            entry.innerHTML = htmlText;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function triggerImpactFX(target, type) {
            const canvas = document.getElementById('fxCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            const targetX = target === 'opp' ? canvas.width * 0.78 : canvas.width * 0.22;
            const targetY = target === 'opp' ? canvas.height * 0.28 : canvas.height * 0.72;

            const conf = TYPE_COLORS[type] || TYPE_COLORS.Normal;
            const color = conf.hex;

            let particles = [];
            for (let i = 0; i < 24; i++) {
                particles.push({
                    x: targetX, y: targetY,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.5) * 16,
                    radius: Math.random() * 7 + 2,
                    alpha: 1
                });
            }

            let frame = 0;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.alpha -= 0.05;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fill();
                });
                frame++;
                if (frame < 22) requestAnimationFrame(animate);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            animate();
        }

        window.onload = function() {
            startNewBattle();
        };
    </script>
</body>
</html>
